<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interno - Hs Gremiales</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a href="index.html">
            <img class="encabezado" src="./images/sevina.jpg" alt="encabezado sevina">
        </a> 
    </header>
    
    <main class="dashboard">
    <!-- COLUMNA IZQUIERDA: LOGIN -->
        <section class="columna-login">
            <div class="card">
                <h1>Consulta de Salidas</h1>
                <p>Ingresá tus credenciales</p>
                
                <div class="form-group">
                    <label for="inputUsuario">Usuario</label>
                    <input type="text" id="inputUsuario" placeholder="Ej: JuanPerez">
                </div>

                <div class="form-group">
                    <label for="inputCodigo">Código</label>
                    <input type="password" id="inputCodigo" placeholder="****">
                </div>

                <button onclick="loginYConsultar()" class="btn-consultar">Ver mis salidas</button>
            </div>
        </section>

    <!-- COLUMNA DERECHA: RESULTADOS (Se activa al loguear) -->
        <section id="columna-resultados" class="columna-resultados hidden">
            <div class="card-resultados">
                <div class="header-resultados">
                    <h2 id="nombreDelegado">Historial</h2>
                    <!-- El botón de descarga debe estar aquí -->
                    <button id="btnDescargar" class="btn-descargar" onclick="descargarTxt()">Descargar .txt</button>
                </div>
                
                <!-- Aquí el JS inyectará la lista de fechas -->
                <div id="resultadoHistorial" class="lista-fechas">
                    <p>Cargando historial...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Al final del body, antes de cerrar el </body>, vinculá el script -->
    <script src="script.js"></script>

</body>
</html>
